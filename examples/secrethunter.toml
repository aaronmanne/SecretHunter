version = 1

[scan]
history = "auto"
respect_gitignore = false
follow_symlinks = false
# workers defaults to the available CPU cores (capped at 16); set it to pin concurrency.
max_file_bytes = 104857600
max_archive_depth = 2
max_decode_depth = 2
max_expanded_bytes_per_record = 104857600
max_expanded_bytes_total = 1073741824
max_archive_members = 10000
timeout_seconds = 600
max_records = 1000000
max_findings = 100000
# Set true to make strings-only binary inspection and other format limitations fail (exit 2).
strict_coverage = false
# Detection sensitivity, 0 (fewest/highest-confidence findings) to 10 (most findings,
# including low-entropy/placeholder-looking values). Only scales generic assignment and
# connection-string rules; provider signatures are unaffected. Default: 5.
sensitivity = 5

[ruleset]
builtins = true
disabled = []

[verification]
mode = "offline"

[output]
# terminal, json, markdown, html, or sarif; the built-in default is "html"
format = "html"
redact = true
include_context = false

[policy]
fail_on_severity = "medium"
fail_on_confidence = "low"

[ignore]
exclude_paths = []

[[rules]]
id = "acme-service-token"
description = "Internal service authentication token"
category = "credential"
severity = "critical"
confidence = "high"
regex = '\bACME_(live|test)_([A-Za-z0-9]{24})\b'
secret_group = 0
keywords = ["ACME_"]
positive_examples = ["ACME_live_0123456789abcdefghijklmn"]
negative_examples = ["ACME_live_short", "ACME_live_${TOKEN}"]
remediation = "Revoke the token, replace it, and move the replacement into a secret store."

[[rules]]
id = "acme-customer-reference"
description = "Internal customer identifier"
category = "sensitive_data"
severity = "high"
confidence = "medium"
regex = '\bCUST-[0-9]{8}\b'
secret_group = 0
paths = ["exports/**", "**/*.csv", "**/*.json"]
positive_examples = ["CUST-12345678"]
negative_examples = ["CUST-123", "PUBLIC-12345678"]
remediation = "Remove unauthorized copies and follow the customer-data incident process."

[[ignore.suppressions]]
id = "synthetic-acme-token-fixture"
rule_ids = ["acme-service-token"]
paths = ["tests/fixtures/**"]
value_regex = '^ACME_test_000000000000000000000000$'
reason = "Explicitly approved synthetic fixture, not a service-issued token."
owner = "app-security@example.invalid"
ticket = "TEST-1234"
expires = "2027-01-31"
